services:
  sRepoBackups:
    image: repo-backups:${TAG:-0}
    build:
      context: .
      dockerfile: Dockerfile
    # always build the image locally and skip remote registry pull attempts
    pull_policy: build
    container_name: cRepoBackups
    restart: unless-stopped
    env_file:
      - .env.docker
    networks:
      - repo-backups_net

networks:
  repo-backups_net:
    name: repo-backups_net
    external: true
